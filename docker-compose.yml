# Local SQL Server for the Relay take-home.
# Port 11433 on the host so this never collides with a SQL Server the reviewer
# already runs on 1433.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: relay-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Relay!Local2026"
      MSSQL_PID: Developer
    ports:
      - "11433:1433"
    volumes:
      - relay-mssql:/var/opt/mssql
    healthcheck:
      # The API waits on this before migrating, so `docker compose up -d --wait`
      # is enough to get to a runnable state in one command.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  relay-mssql:
